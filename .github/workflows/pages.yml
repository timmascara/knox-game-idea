# Deploys the built game to GitHub Pages on every push to main.
#
# Two one-time repo settings are required:
#   1. Settings → Pages → Source: "GitHub Actions"
#   2. Settings → Environments → github-pages → Deployment branches:
#      must allow `main`. GitHub's default here is "default branch only",
#      which works as long as main IS the default branch. A stale branch
#      rule that does not match main makes the deploy job fail instantly
#      with no steps run.
#
# Only main deploys. Feature branches are intentionally excluded: the
# github-pages environment rejects non-default branches anyway, and a second
# triggering branch would cancel main's run via the concurrency group below.
#
# The game then lives at https://<owner>.github.io/<repo>/ which is a full
# page, so pointer lock (mouse capture) works there.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Deploys the built game to GitHub Pages on every push to main or the
# dribble-lab branch. Enable it once in the repo: Settings → Pages →
# Source: "GitHub Actions". The game then lives at
#   https://<owner>.github.io/<repo>/
# which is a full page, so pointer lock (mouse capture) works there.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/basketball-dribbling-game-bhij3v]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
